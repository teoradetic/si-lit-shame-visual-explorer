# App theme (SET-03). Chart colours repeat app/charts.py, which sets the
# period and set colours explicitly so that they never depend on order.
# Font URLs must not contain commas (they separate fallback fonts), and font
# names must not contain digits (Streamlit leaves them unquoted in CSS).

[browser]
gatherUsageStats = false

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
headingFont = "Literata:https://fonts.googleapis.com/css2?family=Literata:wght@400;600&display=swap"
baseRadius = "small"
showWidgetBorder = true

[theme.light]
primaryColor = "#8a4f7d"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#8a4f7d"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#c98bbb"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#f0efec"
borderColor = "#383835"
linkColor = "#c98bbb"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
