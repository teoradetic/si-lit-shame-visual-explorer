[project]
name = "emotion-explorer"
version = "0.1.0"
description = "Interactive explorer of LLM-detected emotion passages (first case: shame) in Slovene novels, 1828-1940"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
# Runtime dependencies of the Streamlit app only. The app reads precomputed
# parquet files and never runs NLP, so keep this list small.
dependencies = [
    "altair>=5.5",
    "pandas>=2.3",
    "pyarrow>=21",
    "streamlit>=1.50",
]

[project.scripts]
emotion-explorer = "emotion_explorer.cli:main"

[dependency-groups]
# Data preparation: reads the raw entry points and writes the compact
# outputs in data/processed.
prep = [
    "zstandard>=0.25",
]
# Lemmas and tags (`emotion-explorer tokens`). Heavy, and only needed to rebuild
# the token tables, so not installed by default: `uv sync --group corpus`.
corpus = [
    "classla==2.2.3",
]
dev = [
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.uv]
default-groups = ["prep", "dev"]
# classla pins protobuf==4.21.2. All groups share one lock, so that pin would
# hold back streamlit and pyarrow in the deployed app.
override-dependencies = ["protobuf>=5"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["data"]
# The app imports its modules from app/, the directory Streamlit runs it from.
src = ["src", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF"]
# En dashes (1828–1940), multiplication and minus signs and rho are intended in
# user-facing text.
allowed-confusables = ["–", "×", "−", "ρ"]

[tool.ruff.lint.per-file-ignores]
# Typographic quotes and dashes are the point of these patterns.
"src/emotion_explorer/text.py" = ["RUF001"]
