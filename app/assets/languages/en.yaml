  time.measures_help: |-
    - **Share of paragraphs:** of all the paragraphs in a novel, the percentage the model marked as about shame. A novel of 1,000 paragraphs with 50 marked scores 5 %. Long and short novels can be compared.
    - **Per 10,000 words:** the same count, divided by the novel's length in words. Useful because paragraph length differs between authors.
    - **Average shame score:** every paragraph, marked or not, has a shame score from 0 to 100 (how sure the model is that it is about shame). This is the novel's average. It does not depend on where the line between marked and unmarked is drawn, but it is not how *intense* the shame is.
    - **With and without shame:** the second group counts the paragraphs the model rated clearly *not* about shame (a low rating on all three of its scales). Its numbers are about ten times larger, so it gets its own panel.
  time.read.scatter: 'How to read: each dot is a novel, placed by its year (across)
