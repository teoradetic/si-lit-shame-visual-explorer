  style.shame_mode: Every chart on this page compares passages with and without shame,
    so this comparison shows all the selected novels together.
  style.too_few: 'Too few novels to compare: {groups}. A group needs at least {n}
    novels with {p} or more paragraphs with and without shame.'
  style.find.group: '**{group}:** {items}.'
  style.find.more: '{feature} {x}× as frequent with shame'
  style.find.less: '{feature} {pct} % lower with shame'
  style.find.time: '**{group}:** over time {trend} ({feature} with shame, ρ = {rho}).'
  style.find.rise: the value tends to rise
  style.find.fall: the value tends to fall
  style.find.flat: there is no clear trend
  style.find.none: '**{group}:** no clear difference.'
  style.methodology: |-
    - **Measures** per paragraph: words per sentence (rule-based sentence split); words of three or more letters repeated within the previous 10 words; ! ? ; , … and dashes per 1,000 characters. MATTR (window of 100 words) is computed on all the words of a novel's set.
    - **Pooling:** counts are summed per novel and set before rates are formed, so each novel gives one pair, with against without shame. Novels need at least {min_p} paragraphs in each set; a group needs at least {min_n} such novels.
    - **Index:** 100 × (1 + mean per-novel difference ÷ mean value without shame); the 95 % interval comes from {boot} bootstrap resamples of novels.
    - **Test:** a two-sided sign-flip permutation test of the mean per-novel difference ({perms} permutations), with Holm's correction across the {n_features} measures of each group. Filled dots: Holm-adjusted p < 0.05.
    - **Speech:** the text between quotation marks (» « „ “ ", each mark opening or closing); without quotes, a paragraph that starts with a dash is all speech. *Narration* is the rest of the paragraph.
    - **Ellipses:** any run of two or more dots, spaced or not (.. ... . . . …), counts once.
    - **Over time:** the per-novel values of each set, averaged over the novels published within {window} years around each year; years with fewer than {min_window} novels are left out. The band is a 95 % normal interval over novels. The trend in the findings is Spearman's ρ between the year and the value with shame; |ρ| < {clear} counts as no clear trend.
