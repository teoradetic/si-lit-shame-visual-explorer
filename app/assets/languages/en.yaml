  time.methodology: |-
    - **Unit:** the novel. *Share* = detected paragraphs ÷ all its paragraphs; *per 10,000 words* = detected paragraphs ÷ the word count in the corpus metadata × 10,000; *average shame score* = mean over all its paragraphs of the three ratings rescaled to 0–1 and averaged, × 100.
    - **Without shame:** paragraphs with a low rating on all three scales (0–1 ≤ 0.30, 0–10 ≤ 3, 0–100 ≤ 30).
    - **Trend lines:** LOESS (Vega-Lite, bandwidth 0.5) for groups of at least {trend} novels.
    - **Moving average:** unweighted mean of the novels published from y − {half} to y + {half} − 1, drawn where at least {n} novels fall in the window; band = mean ± 1.96 · SD / √n (a normal approximation, not a test).
    - **Box plots:** quartiles; whiskers reach the furthest novel within 1.5 × IQR.
    - **Findings:** the median per group, and Spearman's rank correlation ρ of the measure with the year (|ρ| < {clear} counts as no clear trend). Descriptive only: no test, and no control for confounds such as the author.
