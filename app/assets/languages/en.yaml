  words.methodology: |-
    - **Words:** lemmas, lower-cased, from CLASSLA tagging (the source corpora's annotation for 262 novels, CLASSLA run here for the other 43). A lemma's part of speech is the one most of its tokens have. Names are removed: lemmas whose tokens are mostly proper nouns or inside a named entity. A passage contains a word if it has one of its forms; each form belongs to the lemma most of its occurrences have. *Verbs* keeps lemmas tagged VERB, *Nouns and adjectives* NOUN and ADJ, *Meaningful words* all but the function words. *Speech* and *Narration* split each paragraph as on the Style page: words between quotation marks, or in a paragraph that opens with a dash, are speech.
    - **Sets:** the detected paragraphs of the compared novels against their comparison paragraphs (one low-score partner per detected paragraph, from the same novel, within a factor of 2 in length).
    - **Measure:** weighted log-odds ratio δ with an informative Dirichlet prior (Monroe, Colaresi and Quinn 2008); the prior is the corpus word frequency, scaled to the size of each set, so that a word as frequent on both sides scores 0 however unequal their sizes. Words are ranked by z = δ / SE(δ), which weighs a word's ratio by how much evidence there is for it; the plain ratio, δ alone and the mean shame score of the paragraphs with the word were tried and put rare one-off words first. *Times more frequent* is the plain ratio of the two frequencies, with half a count added to each side so that a word missing on one side stays finite; e^δ is not used for it, because the prior pulls it towards 1, the more so the rarer the word.
    - **Filters:** at least {min_count} occurrences in the two sets; a typical word must recur on its side in at least {novels} novels by {authors} authors (the rule is relaxed for small groups).
    - **Groups:** each group is computed on its own novels. A word belongs to a group when its ratio there is at least {factor}× that of every other group; z is not compared across groups, because it grows with the amount of text.
    - **Pairs:** two words come together when they share a CLASSLA sentence of a passage with shame; only words that are not function words. Strength is PMI, shown as 2^PMI, how many times as often as chance. Kept are the pairs that share at least {pair_sentences} sentences in {pair_novels} novels of the broad tier and come together at least twice as often as chance there; in the selected novels, a pair needs {together} sentences. In the network each word keeps its {links} strongest links. The network is laid out by force (Fruchterman and Reingold), so only its links, not the distances, carry meaning.
    - **Cases:** the CLASSLA case of each occurrence of a clicked word, counted in the same sets; words without case (verbs, adverbs) show no chart.
    - Thousands of words are compared, so the lists are descriptive: z > 3 is not a corrected significance level.
