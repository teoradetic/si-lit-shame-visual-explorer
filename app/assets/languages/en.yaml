  themes.find.with: 'More common with shame: {themes}.'
  themes.find.without: 'More common without it: {themes}.'
  themes.selected: Passages on the theme “{theme}”
  themes.methodology: |-
    - **Paragraphs:** the broad tier's detected paragraphs and their comparison paragraphs (as on the Words page), pooled, so that both share one set of themes; the core tier uses its own part of them.
    - **Words:** noun and adjective lemmas, without names and without the emotion's own words (those containing its stem); a lemma must occur in at least {min_paragraphs} paragraphs and in at most {max_share} % of them.
    - **Themes:** non-negative matrix factorization (NMF) of the paragraphs' TF-IDF weights into {n} themes, not the LDA of the earlier study. A paragraph's main theme is the one with the largest weight; its share of the paragraph's weights ranks the passages.
    - **Shares:** the share of each set's paragraphs whose main theme it is; *times more common* divides the share with shame by the share without, both over all compared novels. Descriptive, not tested.
