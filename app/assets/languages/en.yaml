  people.methodology: |-
    - **Who acts:** CLASSLA tokens tagged as singular past-tense verbs (l-participles, VERB or AUX) with feminine or masculine gender, in the detected paragraphs and their comparison set (as on the Words page), pooled over the compared novels. Neuter and plural forms are left out. Descriptive, not tested.
    - **Names:** lemmas whose tokens are mostly proper nouns or inside a named entity, with at least {min_count} occurrences; ranked like the words (weighted log-odds), with the same rules on recurrence across novels and authors.
  themes.title: Themes with and without shame
  themes.intro: 'This page sorts the passages into themes. A theme is a set of words
    that often appear together in the same paragraphs, found by the computer without
    knowing what the words mean: *oče, sin, hči, brat*, for instance, form a family
    theme. Each theme is named by its four most characteristic words, and themes can
    share words: a theme around the father and one around the mother both have *sin*
    and *hči*. Every paragraph gets the theme it fits best. What a theme stands for
    is for a literary scholar to interpret. The chart shows which themes are more
    common in passages about shame than in passages from the same novels without it;
    a passage without detected shame may still hold shame the model missed.'
