  style.measures_title: What do the measures mean?
  style.measures_help: |-
    - **Words per sentence:** the average length of a sentence.
    - **Vocabulary diversity (MATTR):** take any 100 words in a row and count how many of them are different; MATTR is the average share over the whole text. 0.78 means about 78 different words in every 100. Higher means a richer, less repetitive vocabulary. Unlike a simple count, it does not depend on the length of the text.
    - **Words repeated within 10 words:** the share of words that already appeared among the 10 words before them (short words are ignored).
    - **Exclamation marks, question marks, semicolons, commas, ellipses, dashes:** how many per 1,000 characters.
