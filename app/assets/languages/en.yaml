  position.methodology: |-
    - **Parts:** a paragraph's position is (i + 0.5) / N for paragraph i of N; positions are cut into {bins} equal parts of {part} %.
    - **Where shame concentrates:** per novel, the share of detected paragraphs in a part ÷ the novel's overall share, averaged over the novels with at least {min_tagged} counted paragraphs, so that every novel weighs the same; band = mean ± 1.96 · SE across novels.
    - **Share in each part:** pooled, i.e. detected ÷ all paragraphs summed over the novels, so long novels weigh more.
    - **Smoothing:** a centred moving average over three parts.
    - **Violins:** Gaussian kernel density of the positions (bandwidth {bw} percentage points), reflected at 0 and 100 % against edge bias, scaled so that an even spread is 1.
    - **Without shame:** paragraphs with a low rating on all three scales; in *Novel by novel* the length-matched comparison set of the Words and Style pages.
    - **Arcs:** per novel, the share of detected paragraphs in each tenth, scaled to sum to 1 (the shape, not the amount); novels need at least {arc_min} detected paragraphs. k-means with four clusters, fitted once on all novels; the filters only choose which are shown.
    - **Findings:** the part with the highest concentration, and the mean concentration of the first and last fifth; with *Typical arcs*, each group's commonest arc. Descriptive only.
