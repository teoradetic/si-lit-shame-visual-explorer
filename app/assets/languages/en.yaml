  themes.selected: Passages on the theme “{theme}”
  themes.methodology: |-
    - **Paragraphs:** the detected paragraphs and their comparison paragraphs (as on the Words page), pooled, so that both share one set of themes.
    - **Words:** noun and adjective lemmas, without names and without the emotion's own words (those containing its stem); a lemma must occur in at least {min_paragraphs} paragraphs and in at most {max_share} % of them.
    - **Themes:** non-negative matrix factorization (NMF) of the paragraphs' TF-IDF weights into {n} themes, not the LDA of the earlier study. A paragraph's main theme is the one with the largest weight; its share of the paragraph's weights ranks the passages. A theme is named by the words with the highest weight times the share of the word's weight that falls on this theme, so that words common to many themes come later.
    - **Shares:** the share of each set's paragraphs whose main theme it is; *times as common* divides the share with shame by the share without; with groups, each group against its own passages without shame. Descriptive, not tested.
    - **Two themes:** the noun and adjective lemmas of the passages with shame whose main theme is one or the other, compared as on the Words page (weighted log-odds, ranked by z; a word must recur in several novels and authors); {n_pair} words per side. Bar length is the plain ratio of the two frequencies, on a log scale.
