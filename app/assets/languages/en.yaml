  words.function_title: What are function words?
  words.function_help: 'Function words are short grammatical words that carry little
    meaning on their own: pronouns (*jaz, ti, on*), auxiliary verbs (*biti* in *je
    bil*), prepositions (*v, na, z*), conjunctions (*in, da, ker*), particles (*ne,
    še, že*), determiners (*ta, vsak*) and numerals. They dominate any word list,
    so only *All words* shows them. They are recognised by their part of speech, as
    the grammatical analysis assigned it to most occurrences of the word. The commonest:'
