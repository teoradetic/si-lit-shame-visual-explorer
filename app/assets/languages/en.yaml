  home.intro: Where, when and how does shame appear in Slovene novels? A computer
    model read all {novels} novels in this collection, by {authors} authors and published
    {first}–{last}, paragraph by paragraph, and marked the paragraphs it judged to
    be about shame. Use the charts to explore these paragraphs; every chart leads
    to the passages themselves.
  home.caveat: '**The model does not find all shame.** It catches perhaps a quarter
    of the paragraphs about shame, and about one in four of the paragraphs it marks
    are not really about shame. So the charts show where the model *found* shame,
    not everywhere shame is. More in *Method and caveats*.'
