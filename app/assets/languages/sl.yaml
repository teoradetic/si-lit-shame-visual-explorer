  themes.selected: Odlomki na temo »{theme}«
  themes.methodology: |-
    - **Odstavki:** zaznani odstavki in njihovi primerjalni odstavki (kot na strani Besede), združeni, da si delijo iste teme.
    - **Besede:** leme samostalnikov in pridevnikov, brez imen in brez besed samega čustva (tistih, ki vsebujejo njegov koren); lema se mora pojaviti v vsaj {min_paragraphs} odstavkih in v največ {max_share} % odstavkov.
    - **Teme:** nenegativna matrična faktorizacija (NMF) uteži TF-IDF odstavkov v {n} tem, ne LDA prejšnje študije. Glavna tema odstavka je tista z največjo utežjo; njen delež med utežmi odstavka razvršča odlomke. Glavne besede teme so tiste z največjo utežjo, pomnoženo z deležem uteži besede, ki pade na to temo, tako da so besede, skupne mnogim temam, nižje.
    - **Imena:** predlagal jih je model umetne inteligence (Claude, Anthropic), potem ko je prebral glavne besede vsake teme in njene štiri najmočnejše odlomke s sramom; zapisana so enkrat, ne med delovanjem aplikacije. So razlaga, ki jo morajo preveriti literarni zgodovinarji, ne del izračuna; test odpove, ko novo prileganje spremeni teme, da zastarela imena ne morejo ostati.
    - **Deleži:** delež odstavkov vsakega nabora, katerih glavna tema je; *kolikokrat pogostejša* deli delež s sramom z deležem brez njega; pri skupinah vsako skupino z njenimi lastnimi odlomki brez sramu. Opisno, brez testa.
    - **Dve temi:** leme samostalnikov in pridevnikov v odlomkih s sramom, katerih glavna tema je ena ali druga, primerjane kot na strani Besede (uteženo razmerje logaritemskih obetov, razvrščeno po z; beseda se mora ponoviti v več romanih in pri več avtorjih); na vsaki strani besed: {n_pair}. Dolžina stolpca je navadno razmerje obeh pogostnosti na logaritemski lestvici.
