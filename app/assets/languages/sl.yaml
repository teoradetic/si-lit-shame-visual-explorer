  home.intro: Kje, kdaj in kako se v slovenskih romanih pojavlja sram? Računalniški
    model je prebral vseh {novels} romanov te zbirke ({authors} avtorjev in avtoric,
    izdanih v letih {first}–{last}), odstavek za odstavkom, in označil tiste, za katere
    je presodil, da govorijo o sramu. Z grafi lahko te odstavke raziskujete; vsak
    graf vodi do samih odlomkov.
  home.caveat: '**Model ne najde vsega sramu.** Ujame morda četrtino odstavkov o sramu,
    približno eden od štirih odstavkov, ki jih označi, pa v resnici ne govori o sramu.
    Grafi zato kažejo, kje je model sram *našel*, ne pa povsod, kjer sram je. Več
    v razdelku *Metodologija in omejitve*.'
