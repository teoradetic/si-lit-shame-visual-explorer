  time.methodology: |-
    - **Enota:** roman. *Delež* = zaznani odstavki ÷ vsi odstavki romana; *na 10.000 besed* = zaznani odstavki ÷ število besed iz metapodatkov korpusa × 10.000; *povprečna ocena sramu* = povprečje vseh odstavkov romana, pri čemer je ocena odstavka povprečje treh ocen, preračunanih na 0–1, × 100.
    - **Brez sramu:** odstavki z nizko oceno na vseh treh lestvicah (0–1 ≤ 0,30, 0–10 ≤ 3, 0–100 ≤ 30).
    - **Trendne črte:** LOESS (Vega-Lite, pasovna širina 0,5) za skupine z vsaj {trend} romani.
    - **Drseče povprečje:** netehtano povprečje romanov, izdanih od leta y − {half} do y + {half} − 1, prikazano, kjer je v oknu vsaj {n} romanov; pas = povprečje ± 1,96 · SD / √n (normalni približek, ne test).
    - **Škatle z ročaji:** kvartili; ročaja segata do najbolj oddaljenega romana znotraj 1,5 × IQR.
    - **Ugotovitve:** mediana posamezne skupine in Spearmanov koeficient ρ med mero in letom (|ρ| < {clear} pomeni, da jasnega trenda ni). Le opisno: brez testa in brez nadzora motečih dejavnikov, kot je avtor.
  position.intro: Ali se sram pojavi zgodaj v zgodbi, v sredini ali proti koncu? Izberite
    graf; vsak pogleda na vprašanje z druge strani, razdeljen po primerjavi, izbrani
    v stranski vrstici.
