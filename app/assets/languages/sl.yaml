  themes.title: Teme s sramom in brez njega
  themes.intro: 'Ta stran razvrsti odlomke v teme. Tema je skupina besed, ki se pogosto
    pojavljajo skupaj v istih odstavkih; računalnik jih najde, ne da bi vedel, kaj
    besede pomenijo: *oče, sin, hči, brat* na primer tvorijo družinsko temo. Teme
    si lahko besede delijo: tema okoli očeta in tema okoli matere imata obe *sin*
    in *hči*. Imena in kratke opise je predlagal model umetne inteligence, potem ko
    je prebral besede in odlomke vsake teme; so prvo branje, ne rezultat. Vsak odstavek
    dobi temo, ki mu najbolj ustreza. Kaj tema pomeni, mora razložiti literarni zgodovinar.
    Graf kaže, katere teme so pogostejše v odlomkih o sramu kot v odlomkih iz istih
    romanov brez njega; odlomek brez zaznanega sramu lahko še vedno vsebuje sram,
    ki ga model ni zaznal.'
