  position.methodology: |-
    - **Deli:** mesto odstavka i od N je (i + 0,5) / N; mesta so razdeljena na {bins} enakih delov po {part} %.
    - **Kje se sram zgosti:** za vsak roman delež zaznanih odstavkov v delu ÷ delež v celem romanu, povprečeno čez romane z vsaj {min_tagged} preštetimi odstavki, tako da vsak roman šteje enako; pas = povprečje ± 1,96 · SE čez romane.
    - **Delež v vsakem delu:** združeno, tj. zaznani ÷ vsi odstavki, sešteto čez romane, zato dolgi romani štejejo več.
    - **Glajenje:** centrirano drseče povprečje treh delov.
    - **Violine:** Gaussova jedrna gostota mest (pasovna širina {bw} odstotnih točk), zrcaljena pri 0 in 100 % proti pristranskosti na robovih, umerjena tako, da je enakomerna porazdelitev 1.
    - **Brez sramu:** odstavki z nizko oceno na vseh treh lestvicah; v pogledu *Roman za romanom* po dolžini usklajeni primerjalni nabor strani Besede in Slog.
    - **Oblike:** za vsak roman delež zaznanih odstavkov v vsaki desetini, umerjen na vsoto 1 (oblika, ne količina); roman potrebuje vsaj {arc_min} zaznanih odstavkov. Krivulja, povprečena čez tri sosednje desetine, je korelirana (Pearson) s petimi stalnimi oblikami: naraščajočo in padajočo premico, polovico sinusnega vala navzgor (vrh) in navzdol (dolina) ter kvadriranim sinusnim valom (dva vrhova). Najboljše ujemanje poimenuje obliko romana, če je korelacija vsaj {arc_fit}; sicer je roman brez jasne oblike. Oblike ohlapno sledijo zgodbenim lokom Reagana in sodelavcev (2016), le da namesto razpoloženja sledijo sramu.
    - **Ugotovitve:** del z največjo zgostitvijo ter povprečna zgostitev prve in zadnje petine; pri *Obliki pripovednega loka* najpogostejša oblika vsake skupine. Le opisno.
