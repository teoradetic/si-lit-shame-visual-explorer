  time.measures_help: |-
    - **Delež odstavkov:** od vseh odstavkov romana odstotek tistih, ki jih je model označil kot odstavke o sramu. Roman s 1.000 odstavki, od katerih je 50 označenih, ima 5 %. Tako lahko primerjamo dolge in kratke romane.
    - **Na 10.000 besed:** isto število, deljeno z dolžino romana v besedah. Uporabno, ker so odstavki pri avtorjih različno dolgi.
    - **Povprečna ocena sramu:** vsak odstavek, označen ali ne, ima oceno sramu od 0 do 100 (kako prepričan je model, da govori o sramu). To je povprečje romana. Ni odvisno od tega, kje potegnemo mejo med označenimi in neoznačenimi, ni pa mera *jakosti* sramu.
    - **S sramom in brez njega:** druga skupina šteje odstavke, za katere je model presodil, da zagotovo *ne* govorijo o sramu (nizka ocena na vseh treh lestvicah). Njene vrednosti so približno desetkrat večje, zato ima svoj graf.
