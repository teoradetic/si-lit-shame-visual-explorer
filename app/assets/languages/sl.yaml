  themes.about.0: Romantična ljubezen, hrepenenje in trpljenje duše, pogosto v izpovedih
    in zavrnitvah.
  themes.about.1: Očetje, ki sodijo, prepovedujejo in kaznujejo, z jezo, orožjem in
    govorjenjem o krivici, pogosto med posestniki; za razliko od teme o materi gre
    za oblast in kazen, ne za skrb.
  themes.about.2: 'Roke, oči, obrazi, ustnice in solze: sram, nežnost in nasilje,
    vidni na telesu.'
  themes.about.3: 'Ogovori in stanovi: gospodje, župniki, doktorji, grofje, baroni
    in njihovi služabniki.'
  themes.about.4: 'Gibanje po prostoru: ceste, vrata, okna, vozovi in nebo; pogostejše
    brez sramu.'
  themes.about.5: 'Matere, pogosto vdove, s sinovi in hčerami doma: kuhinja, mleko,
    postelja in solze; za razliko od teme o očetu gre za skrb in žalost, ne za kazen.'
  themes.about.6: 'Moralne sodbe o ljudeh: pošten ali hudoben, pameten ali neumen,
    in kaj govorijo vaščani.'
  themes.about.7: 'Vrstilne besede in »drugi«: prvi, drugi, tretji, nekdo drug; tema
    zgradbe bolj kot vsebine.'
  themes.about.8: 'Biti sam s seboj: krivda, vest, misli ter zadovoljstvo ali nezadovoljstvo.'
  themes.about.9: Možje in žene, poroke in zakonsko življenje ter to, kako zakonca
    ravnata drug z drugim.
  themes.about.10: 'Greh, Bog, cerkev, milost in pokora: verska sodba in nauk.'
  themes.about.11: 'Koledar zgodbe: dnevi, noči, večeri, tedni in nedelje.'
  themes.about.12: 'Hiša in kmetija: gospodarji, hlevi, strehe, pragovi in vas.'
  themes.about.13: Otroci, nedolžnost, starši in šola, pogosto revni in potrebni zaščite.
  themes.about.14: Lepa dekleta in mlade ženske, lepota in pesmi, kot jih vidijo in
    snubijo moški.
  themes.about.15: 'Prijatelji, delo, vino in zdravje: dobra in slaba volja v vsakdanji
    družbi.'
  themes.about.16: 'Starost in rodovi: stari in mladi, sinovi, grofje, gradovi in
    pravde.'
  themes.about.17: 'Kako dolgo je kaj trajalo: čakanje, zamude in zadnjič.'
  themes.about.18: 'Denar, kovanci, žepi, obresti in hranilnice: dolgovi, kraje in
    plačila.'
  themes.about.19: 'Besede, usta, glas in jezik: kaj je bilo rečeno, dana beseda in
    njena čast.'
  themes.col.about: O čem govori
