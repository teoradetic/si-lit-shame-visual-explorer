  style.methodology: |-
    - **Mere** na odstavek: besede na poved (delitev na povedi s pravili); besede s tremi ali več črkami, ponovljene med 10 besedami pred njimi; ! ? ; , … in pomišljaji na 1.000 znakov. MATTR (okno 100 besed) je izračunan na vseh besedah nabora posameznega romana.
    - **Združevanje:** števila so seštevana po romanu in naboru, preden so izračunani deleži, zato vsak roman da en par, s sramom proti brez. Roman potrebuje vsaj {min_p} odstavkov v vsakem naboru, skupina vsaj {min_n} take romane.
    - **Razmerje:** 1 + povprečna razlika po romanih ÷ povprečna vrednost brez sramu, prikazano na logaritemski osi; 95-odstotni interval izhaja iz {boot} ponovnih vzorčenj romanov (bootstrap).
    - **Test:** dvostranski permutacijski test z naključnim obračanjem predznakov povprečne razlike po romanih ({perms} permutacij), s Holmovim popravkom čez {n_features} mer vsake skupine. Polne točke: p po Holmu < 0,05.
    - **Govor:** besedilo med narekovaji (» « „ “ ", vsak narekovaj govor odpre ali zapre); brez narekovajev je govor ves odstavek, ki se začne s pomišljajem. *Pripoved* je preostanek odstavka.
    - **Tropičja:** vsak niz dveh ali več pik, s presledki ali brez (.. ... . . . …), šteje enkrat.
    - **Skozi čas:** vrednosti posameznih romanov v vsakem naboru, povprečene čez romane, izdane v {window} letih okoli vsakega leta; leta z manj kot {min_window} romani so izpuščena. Pas je 95-odstotni normalni interval čez romane. Trend v ugotovitvah je Spearmanov ρ med letom in vrednostjo s sramom; |ρ| < {clear} šteje kot brez jasnega trenda.
