  words.methodology: |-
    - **Besede:** leme z malimi črkami, iz označevanja s CLASSLA (označbe izvornih korpusov za 262 romanov, CLASSLA, zagnan tukaj, za preostalih 43). Besedna vrsta leme je tista, ki jo ima večina njenih pojavitev. Imena so odstranjena: leme, katerih pojavitve so večinoma lastna imena ali del imenske entitete. Odlomek vsebuje besedo, če vsebuje katero od njenih oblik; vsaka oblika pripada lemi, ki jo ima večina njenih pojavitev. *Glagoli* obdržijo leme z oznako VERB, *Samostalniki in pridevniki* NOUN in ADJ, *Pomenske besede* vse razen funkcijskih. *Govor* in *Pripoved* razdelita odstavek kot na strani Slog: besede med narekovaji ali v odstavku, ki se začne s pomišljajem, so govor.
    - **Funkcijske besede:** zaimki (*jaz, ti, on*), pomožni glagoli (*biti* v *je bil*), predlogi (*v, na, z*), vezniki (*in, da, ker*), členki (*ne, še, že*), določilniki (*ta, vsak*) in števniki: kratke slovnične besede, ki same po sebi nimajo veliko pomena in bi prevladale v vsakem seznamu, zato jih kaže le izbira *Vse besede*. Beseda šteje mednje po besedni vrsti, ki jo ima večina njenih pojavitev. Najpogostejše: {function_words}.
    - **Nabora:** zaznani odstavki primerjanih romanov proti njihovim primerjalnim odstavkom (en par z nizko oceno na zaznani odstavek, iz istega romana, do 2-krat daljši ali krajši).
    - **Mera:** uteženo razmerje logaritemskih obetov δ z informativno Dirichletovo apriorno porazdelitvijo (Monroe, Colaresi in Quinn 2008); apriorna je pogostnost besede v korpusu, umerjena na velikost vsakega nabora, tako da ima beseda, enako pogosta na obeh straneh, vrednost 0 ne glede na to, kako različno velika sta. Besede so razvrščene po z = δ / SE(δ), ki razmerje besede utehta s tem, koliko dokazov je zanj; navadno razmerje, sam δ in povprečna ocena sramu odstavkov z besedo so bili preizkušeni in na vrh postavijo redke enkratne besede. *Kolikokrat pogostejša* je navadno razmerje obeh pogostnosti, pri čemer je vsaki strani dodana polovica pojavitve, da beseda, ki na eni strani manjka, ostane končna; e^δ za to ni uporabljen, ker ga apriorna porazdelitev vleče proti 1, tem bolj, čim redkejša je beseda.
    - **Filtri:** vsaj {min_count} pojavitev v obeh naborih; značilna beseda se mora na svoji strani ponoviti v vsaj {novels} romanih {authors} avtorjev (za majhne skupine je pravilo blažje).
    - **Skupine:** vsaka skupina je izračunana na svojih romanih. Beseda pripada skupini, če je njeno razmerje tam vsaj {factor}-krat večje kot v vsaki drugi skupini; z med skupinami ni primerjan, ker raste s količino besedila.
    - **Pari:** besedi se pojavljata skupaj, če si delita poved (po CLASSLA) v odlomku s sramom; le besede, ki niso funkcijske. Moč para je PMI, prikazan kot 2^PMI, kolikokrat pogosteje kot po naključju. Ohranjeni so pari, ki si delijo vsaj {pair_sentences} povedi v {pair_novels} romanih in se tam pojavljajo vsaj dvakrat pogosteje kot po naključju; v izbranih romanih par potrebuje {together} povedi. V mreži vsaka beseda obdrži {links} najmočnejše povezave. Mreža je razporejena s simulacijo sil (Fruchterman in Reingold), zato pomen nosijo le povezave, ne razdalje.
    - **Skloni:** sklon vsake pojavitve izbrane besede po CLASSLA, štet v istih naborih; besede brez sklona (glagoli, prislovi) grafa nimajo.
    - Primerjamo na tisoče besed, zato so seznami opisni: z > 3 ni popravljena raven statistične značilnosti.
